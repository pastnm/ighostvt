# A roothide package built on demand, published as its own Release — one per
# build, the way a version is — so the newest one is always here:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/<package>.deb
#
# `releases/latest/download` follows whichever Release is marked Latest, which
# this workflow sets on every build, so that link needs no maintenance as
# builds come. Each build keeps its own tag (`deb-<version>-<build>`) and the
# date it was published: a single reused tag cannot do that — GitHub writes a
# release's date once, at creation, and editing it later never moves it.
#
# This is not a release of iGhostVT. `ci.yml` still builds and verifies every
# flavour on a push, and `release.yml` still publishes what CI built when a
# version tag is cut; no version is bumped here. The point is a build from a
# branch — a rendering fix waiting on a few hours of screen time, say — on the
# device without waiting for a release, and without an APT repo or a second
# token: the package goes to the repository's own Releases, uploaded with
# `GITHUB_TOKEN`, which is why this file asks for `contents: write`.
#
# It runs by itself on a push to a `fix/**` branch, so a branch pushed to this
# fork arrives as a package from a direct link without anyone dispatching
# anything. `workflow_dispatch` is how another branch is built; `main` never
# runs it — a package for main is a release, and `release.yml` makes those.
#
# The image is `xcode-27` with Xcode 27.1 selected by name, not "newest": a
# device build has to compile against the iOS 27.1 SDK (`make ios-sdk-check`,
# the floor that lets iPhone Duo lay the app out to its edges), the image also
# carries a 27.2 release candidate, and `macos-26` has neither.

name: Deb release

on:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label for the build — one that carries the iOS 27.1 SDK
        type: string
        default: xcode-27

# The upload writes to the repository's releases; everything else is read.
permissions:
  contents: write

# One build at a time: two finishing together would fight over which Release
# is Latest, and `releases/latest/download` would answer with either.
concurrency:
  group: ighostvt-deb-release
  cancel-in-progress: false

env:
  # Higher than ci.yml's 100 on purpose: that floor carries the upstream
  # repository's run counter past the counter the old publishing workflow left
  # behind, while a fork starts counting at 1 again. The build number has to
  # stay above the installed one (160 at 1.6.21) — LaunchServices keeps the
  # higher build's record and goes on reading its Info.plist — so the floor
  # here buys a thousand runs of room on top of that.
  BUILD_NUMBER_FLOOR: "1000"
  GH_TOKEN: ${{ github.token }}

jobs:
  deb-roothide:
    runs-on: ${{ github.event.inputs.runner || 'xcode-27' }}
    timeout-minutes: 60

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v7

      # The iOS 27.1 SDK, which `make`'s ios-sdk-check requires of every
      # device build (a package is built by one). Named, not "newest": the
      # image also ships a 27.2 release candidate, which sorts after it.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install packaging tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ldid dpkg xcbeautify
          ldid -h 2>&1 | head -n1 || true
          dpkg-deb --version | head -n1

      # The version stays the commit's; only the build number is this run's,
      # taken from the same run counter ci.yml uses so a package built here
      # never claims a build number a released one already used. Both are
      # exported for the notes written at the end.
      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          build="$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"
          # And never at or below the build the checkout already carries: a
          # package that is not newer than the one installed is one
          # LaunchServices ignores the Info.plist of.
          current="$(make --no-print-directory print-build-number)"
          [ "$build" -gt "$current" ] || build="$(( current + 1 ))"
          make set-version VERSION="$version" BUILD="$build"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD=$build" >> "$GITHUB_ENV"

      - name: Build roothide package (iphoneos-arm64e)
        run: make deb-roothide

      - name: Verify the package
        run: |
          set -euo pipefail
          deb="$(ls build/Packages/*.deb)"
          dpkg-deb -f "$deb" Package Version Architecture
          [ "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e ] \
            || { echo "not a roothide package: $deb" >&2; exit 1; }

      - name: Checksums
        run: |
          set -euo pipefail
          cd build/Packages
          shasum -a 256 *.deb | tee SHA256SUMS.roothide

      # One Release per build: the tag carries the version and the build
      # number (`deb-1.6.21-1006`), so nothing is overwritten, every entry
      # keeps the date it was published, and the newest is what
      # `releases/latest/download` answers with — this step marks it Latest.
      # A single reused tag could not: GitHub writes a release's date once,
      # at creation, and editing it never moves that date.
      #
      # The one `deb-latest` release the earlier workflow kept is retired
      # here, tag and all; the fixed link it served is replaced by
      # `releases/latest/download`, which follows the newest build.
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          tag="deb-${APP_VERSION}-${APP_BUILD}"
          deb="$(ls build/Packages/*.deb | head -n1)"
          name="$(basename "$deb")"
          digest="$(shasum -a 256 "$deb" | awk '{print $1}')"
          title="iGhostVT ${APP_VERSION} dev build (build ${APP_BUILD})"
          description="Built by ${GITHUB_WORKFLOW} from ${GITHUB_SHA} at run ${GITHUB_RUN_NUMBER} — an on-demand build, not a release. Install it, then bring the app back to the front after a while off screen to check the fix.

          ${name}
          SHA-256: ${digest}"
          if gh release view deb-latest >/dev/null 2>&1; then
            gh release delete deb-latest --yes --cleanup-tag
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # The same run dispatched again: its tag is already there, and its
            # date is already right.
            gh release edit "$tag" \
              --title "$title" \
              --notes "$description" \
              --latest
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$description" \
              --latest
          fi
          gh release upload "$tag" --clobber build/Packages/*.deb build/Packages/SHA256SUMS.roothide
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${name}"
          echo "- [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json assets -q '.assets[] | "\(.name)\t\(.size)"'
